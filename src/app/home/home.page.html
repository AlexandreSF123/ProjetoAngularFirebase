        </ion-header>
        <ion-content class="ion-padding">
            <ion-row>
                <ion-col size="3">
                    <ion-avatar>
                        <img src="https://static0.cbrimages.com/wordpress/wp-content/uploads/2021/04/pokemon-rattata.jpg?w=1600&h=900&fit=crop">

                </ion-col>

                <ion-col size="9">
                    <ion-item>
                        <ion-label>
                            <h1>Rattata</h1>

                    </ion-item>
                    <ion-item>
                        <ion-label>
                            rattatagod@gmail.com
                        </ion-label>

    <div class="ion-page" id="main-content">

            <ion-toolbar>

        <ion-content class="ion-padding">
